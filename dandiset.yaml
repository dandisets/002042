studyTarget:
- In the present work, we used a progressive mouse model of nigrostriatal degeneration
  (i.e., MitoPark mice 29,30) to conduct longitudinal cellular imaging of neural activity
  in the M1 in freely moving animals during gradually worsening striatal DA depletion.
  Our results demonstrate that, during the progression of Parkinsonism, M1 neurons
  gradually start to show abnormal activity at both cellular and population levels,
  with the corticospinal (CSp) neurons showing a more robust and selective disruption
  in their activity than the intratelencephalic (IT) neurons. In studies of task-related
  activity, we also demonstrated that, as a whole population, M1 pyramidal neurons
  comprise distinct functional clusters for movement encoding, whose organization
  is disrupted as Parkinsonism develops in MitoPark mice. Together, the present work
  provides new insight into cell-subtype-specific adaptations in M1 circuits during
  the progressive loss of midbrain dopaminergic neurons in the parkinsonian state.
